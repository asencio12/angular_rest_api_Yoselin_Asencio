<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Angular Material configurado</mat-card-title>
    <mat-card-subtitle>Tema claro/oscuro</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>
      Usa el botón de la barra superior para cambiar entre tema claro y oscuro.
    </p>
    <div class="demo">
      <mat-spinner diameter="36" />
      <span>Estado de carga (MatProgressSpinner)</span>
    </div>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button type="button" (click)="mostrarMensaje()">
      <mat-icon>notifications</mat-icon>
      Probar SnackBar
    </button>
    <button mat-stroked-button type="button">Botón secundario</button>
  </mat-card-actions>
</mat-card>
