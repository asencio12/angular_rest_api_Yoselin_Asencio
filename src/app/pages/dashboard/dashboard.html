<section class="hero">
  <h1>Explora cuatro universos</h1>
  <p>
    Elige un universo para consultar sus personajes
  </p>
</section>

<section class="grid" aria-label="Universos disponibles">
  @for (universe of universes; track universe.id; let i = $index) {
    <app-universe-card [universe]="universe" [index]="i" />
  }
</section>
